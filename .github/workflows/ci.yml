name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Workflow-level cancellation kills the whole run, deploy-staging included —
  # a job-level concurrency group grants no immunity from that. So main must
  # not cancel, or a second merge can abort a mid-flight railway up or the
  # Alembic preDeployCommand riding inside it. PR churn still cancels freely,
  # which is the only place the saved runner minutes were ever coming from.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install (locked)
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      # `scripts` is in scope because scripts/seed_demo.py drives the real HTTP API
      # to build a demo boutique (docs/real-world-qa.md) — it is a CONTRACT CANARY,
      # so a payload-shape change that breaks it must fail here rather than at the
      # next QA pass. `ruff check .` already covered it; mypy did not.
      - name: Mypy
        run: uv run mypy app tests scripts
      - name: Tests (unit + Testcontainers Postgres)
        run: uv run pytest -q

  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm -r lint
      # The qa-checklist §11 mechanical checks. `make lint` runs these too, but
      # this job calls pnpm directly, so without this step nothing enforces them
      # in CI and the gate is decorative.
      - name: QA mechanical checks (qa-checklist §11)
        run: bash scripts/qa-greps.sh
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Test
        run: pnpm -r --if-present test
      - name: Build
        run: pnpm -r build

  e2e:
    name: Frontend E2E (Playwright + axe)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build apps
        run: pnpm -r build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E (Playwright + axe)
        run: pnpm e2e

  brain:
    name: Code wiki drift (warn-only)
    # warn-only until waves 1-3 are complete and the stale count has held at zero.
    # This is the only mechanical guard against .brain/ silently rotting, so flipping
    # it to blocking is what keeps the wiki trustworthy. See .brain/CLAUDE.md.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Brain drift check
        run: make brain-check
      - name: Brain lint (structure and links)
        run: make brain-lint

  deploy-staging:
    name: Deploy staging (Railway)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # `e2e` is here since F21 because it carries the entire axe pass, and a legal
    # accessibility requirement (IS 5568) that does not block a deploy is not a
    # gate — it is a report. Without it an a11y regression reached staging with a
    # green tick. This lengthens the merge path and that cost is accepted
    # deliberately (spec Risk 4); if the suite flakes, fix the flake rather than
    # adding a retry count.
    #
    # `audit` joins it on the 2026-08-05 review, and the argument above is the
    # SAME argument: F21 took that job off `continue-on-error`, and a blocking
    # job that is not a deploy gate is still only a report. `main` is unprotected
    # in this repo, so on a push a red `audit` reds the workflow while
    # deploy-staging runs anyway — the exact hole `e2e` was added to close, left
    # open one job over. The rule is now mechanical rather than remembered:
    # test_ci_gates.py asserts that EVERY blocking job is listed here, so the
    # next job to lose `continue-on-error` cannot quietly skip this line.
    needs: [backend, frontend, e2e, audit]
    runs-on: ubuntu-latest
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      # The SPAs ride INSIDE the backend upload. `railway up` runs with
      # working-directory: backend and sends only that tree, so the built apps
      # have to be copied into it before the deploy — app/static/{manage,storefront}
      # is where app/main.py mounts them from. Same pnpm/node setup as the
      # `frontend` job; that job proves the build is green, this one needs the
      # artifacts, and a runner keeps nothing between jobs.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install (frozen lockfile)
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build SPAs
        working-directory: frontend
        run: pnpm -r build
      # NOT `dist/` and NOT `staticfiles/`: .gitignore ignores both names
      # anywhere in the tree, `railway up` respects .gitignore, and an ignored
      # copy is dropped from the upload with NO error — green CI, 404s in
      # production. `static/` is ignored by neither, and the next step proves it
      # rather than trusting this comment.
      - name: Copy the SPAs into the backend upload
        run: |
          rm -rf backend/app/static
          mkdir -p backend/app/static
          cp -R frontend/apps/manage/dist backend/app/static/manage
          cp -R frontend/apps/storefront/dist backend/app/static/storefront
          # F25's platform console. ⚠ SPEC D8 CLAIMED "zero workflow edits" AND
          # WAS WRONG ABOUT THIS STEP: `pnpm -r` picks the third app up for
          # lint/typecheck/build with no edit, but these two lines and the assert
          # loop below are hardcoded — without this the console builds green, is
          # never copied into the upload, and production 404s every console URL
          # with every job passing.
          cp -R frontend/apps/platform/dist backend/app/static/platform
      - name: Assert the SPAs are actually in the upload
        # The failure mode this exists for is silent: a renamed outDir, a
        # mistyped path or a new .gitignore rule leaves a green build and a
        # production origin that serves nothing but JSON. Fail here, before
        # `railway up`, where the cause is one step away.
        run: |
          for f in backend/app/static/manage/index.html \
                   backend/app/static/storefront/index.html \
                   backend/app/static/platform/index.html; do
            test -s "$f" || { echo "::error::missing or empty: $f"; exit 1; }
          done
          # Two shells prove the copy ran; they do not prove it carried the
          # ~85 files a real build produces. A truncated copy leaves both
          # index.html in place and every bundle behind it missing.
          copied=$(find backend/app/static -type f | wc -l)
          if [ "$copied" -lt 20 ]; then
            echo "::error::only $copied files under backend/app/static — the copy is truncated"
            exit 1
          fi
          # Over the WHOLE tree, not two files: .gitignore's media/, build/,
          # out/, lib/ and *.local rules are all unanchored and all match
          # somewhere under a dist/. `railway up` drops an ignored path with no
          # error, so a `public/media/` added upstream would ship a green build
          # and broken images. This repo has been bitten by that class twice.
          ignored=$(git ls-files --others --ignored --exclude-standard --directory backend/app/static)
          if [ -n "$ignored" ]; then
            echo "::error::gitignored inside the upload — railway up would silently drop:"
            echo "$ignored"
            exit 1
          fi
      - name: Install Railway CLI
        # Pinned deliberately: the next steps run this binary with RAILWAY_TOKEN in
        # scope, so an unpinned `latest` would auto-adopt a compromised publish on
        # the next merge with no review gate. Dependabot does not watch `npm
        # install -g` in a run step — bump this by hand.
        run: npm install -g @railway/cli@5.30.1
      - name: Deploy api
        working-directory: backend
        run: railway up --service api --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      - name: Deploy worker
        working-directory: backend
        run: railway up --service worker --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      - name: Smoke check
        # Falls back to the generated Railway domain so this works today; set the
        # STAGING_HEALTH_URL repo variable to override once Task 3's real staging
        # domain lands, instead of editing this file. Asserting on the body (not
        # just the status) is what catches a deploy that booted with MEDIA_BUCKET
        # unset — that still answers 200, just with "media":"unconfigured".
        run: |
          url="${{ vars.STAGING_HEALTH_URL || 'https://api-production-2ecb.up.railway.app/health' }}"
          curl -fsS --retry 5 --retry-delay 5 --retry-connrefused "$url" \
            | tee /dev/stderr \
            | jq -e '.status == "ok" and .media == "configured"' > /dev/null

  audit:
    name: Dependency audits
    # BLOCKING since F21 (.planning/security-checklist-v1.md → R34, "Dependency
    # scanning green in CI"). It was warn-only until the nine transitive
    # devDependency advisories it reported were actually cleared, by a lockfile
    # refresh onto patched versions — not by relaxing the job.
    #
    # The frontend half runs the FULL `pnpm audit`, deliberately NOT `--prod`.
    # `--prod` would be green today for free and would be a permanent blind spot
    # over exactly the packages that assemble the bundle: a compromised vite,
    # rolldown or postcss ships to production inside dist/ while never appearing
    # in a production dependency tree. Auditing the toolchain that builds the
    # artifact is the point (spec D4).
    #
    # When this job reds because the registry is down: RETRY. Do not add
    # --ignore-registry-errors — it turns every outage into a silent pass, which
    # is the same defect as continue-on-error wearing another name.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - name: pip-audit (backend)
        working-directory: backend
        # To waive a backend advisory, append `--ignore-vuln <PYSEC-or-GHSA-id>`
        # below and put its four required fields in a comment on the same line:
        # the id, one sentence on why it does not reach this product, the date it
        # was waived, and an expiry at most 90 days out. Re-audit at the expiry —
        # do not extend a waiver in place. (The frontend half is enforced
        # mechanically; see scripts/audit-waivers.mjs. This half is on review,
        # because pip-audit takes its ignores as flags rather than as data.)
        run: |
          uv export --locked --no-emit-project -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      # Runs BEFORE the audit: an expired or unexplained waiver must red with its
      # own message, not let `pnpm audit` pass quietly on a silence nobody owns.
      - name: Dependency-audit waivers are in good standing
        run: node frontend/scripts/audit-waivers.mjs
      - name: pnpm audit (frontend)
        working-directory: frontend
        run: pnpm audit
